name: Build Flet APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet requests boto3

      - name: Pre-install Flutter SDK
        run: |
          # ফ্লেটের প্রম্পট এড়াতে আগেই ফ্লুটার ইনস্টল করে নেওয়া হচ্ছে
          git clone https://github.com/flutter/flutter.git -b stable
          echo "${{ github.workspace }}/flutter/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          # --yes ফ্ল্যাগটি দেওয়া হলো যাতে কোনো প্রশ্ন না করে নিজেই কাজ শেষ করে
          flet build apk --verbose --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-notebook-apk
          path: build/apk/*.apk
